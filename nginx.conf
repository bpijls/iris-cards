server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't expose project internals
    location ~ /\.(?!well-known) { deny all; }
    location ~ \.(py|md|lock)$ { deny all; }
    location /.venv/ { deny all; }
    location /__pycache__/ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
